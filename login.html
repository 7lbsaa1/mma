<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | MusicZone</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo"><i class="fas fa-music"></i><span>MusicZone</span></div>
        <ul class="nav-links">
            <li><a href="/">الرئيسية</a></li>
            <li><a href="/#songs">الأغاني</a></li>
            <li><a href="/login" class="active">تسجيل الدخول</a></li>
        </ul>
    </nav>

    <div class="login-container">
        <div class="login-card">
            <h2>🎵 تسجيل الدخول</h2>
            <input type="email" placeholder="البريد الإلكتروني">
            <input type="password" placeholder="كلمة المرور">
            <button onclick="alert('تم تسجيل الدخول بنجاح! 🎉'); location.href='/';">دخول</button>
            <p style="text-align:center;margin-top:15px;color:var(--muted)">
                ليس لديك حساب؟ <a href="/register" style="color:var(--primary)">إنشاء حساب</a>
            </p>
        </div>
    </div>
</body>
</html>
